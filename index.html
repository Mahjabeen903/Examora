<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Examora: AI-powered exam platform</title>
<meta name="description" content="Create, sit and review exams with an AI tutor, AI exam generator, read-aloud and voice answers. Runs in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f766e'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--acc:#0f766e;--on:#fff;--sb:#0f172a;--ok:#16a34a;--bad:#dc2626;--hl:#f59e0b}
[data-t=dark]{--bg:#0b1220;--card:#131c2e;--ink:#e6edf7;--mut:#94a3b8;--line:#243049;--acc:#2dd4bf;--on:#06201d;--sb:#070d19}
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
a{color:inherit}h1,h2,h3{margin:0 0 .5em;line-height:1.2;letter-spacing:-.01em}h1{font-size:1.7rem;font-weight:800}h2{font-size:1.15rem}h3{font-size:1rem}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.sb{background:var(--sb);color:#cbd5e1;padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{font-weight:800;font-size:1.25rem;color:#fff;text-decoration:none;padding:4px 10px 18px;display:flex;gap:10px;align-items:center}.brand i{width:26px;height:26px;border-radius:8px;background:var(--acc)}
.nb{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;text-decoration:none;padding:9px 12px;border-radius:8px;font:inherit;font-weight:500;cursor:pointer}
.nb:hover,.nb.on{background:#1e293b;color:#fff}.sp{margin-top:auto}
main{padding:28px clamp(16px,4vw,44px);max-width:1100px;width:100%}
button,input,textarea,select{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--acc);color:var(--on);border:1px solid var(--acc);border-radius:8px;padding:8px 16px;font-weight:700;cursor:pointer;text-decoration:none}
.btn.g{background:var(--card);color:var(--ink);border-color:var(--line)}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.sm{padding:5px 10px;font-size:.85rem}
.btn:disabled{opacity:.4;cursor:default}.btn.rec{background:var(--bad);border-color:var(--bad);color:#fff}
:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.mut{color:var(--mut)}.s{font-size:.85rem}.bad{color:var(--bad)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}.sb2{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}.grid .card{margin:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:18px 0}.tiles .card{margin:0}.tiles b{display:block;font-size:1.8rem;font-weight:800}
label{display:block;font-weight:700;margin-top:14px;font-size:.9rem}
input:not([type=checkbox]):not([type=range]),textarea,select{width:100%;margin-top:6px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.r2{display:grid;grid-template-columns:2fr 1fr;gap:12px}.chk{display:flex;gap:8px;align-items:center;font-weight:500}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc)}
.bar{display:flex;justify-content:space-between;align-items:center}.clk{font:800 1.6rem/1 inherit;font-variant-numeric:tabular-nums}.clk.low{color:var(--bad)}
.prog{height:6px;background:var(--line);border-radius:9px;margin:10px 0 16px;overflow:hidden}.prog i{display:block;height:100%;background:var(--acc);transition:width .3s}
.exam{display:grid;grid-template-columns:1fr 230px;gap:16px;align-items:start}.exam .card{margin:0}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin:8px 0;padding:11px 13px;background:none;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.opt:hover{border-color:var(--acc)}.opt.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent)}.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.bb{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--mut);display:inline-grid;place-items:center;flex:none;font-weight:700;font-size:.8rem;background:none;cursor:pointer}.opt.on .bb{background:var(--acc);border-color:var(--acc);color:var(--on)}
.pal{display:flex;flex-wrap:wrap;gap:7px}.pal .bb{border-radius:8px;width:32px;height:32px}.pal .ans{background:var(--acc);border-color:var(--acc);color:var(--on)}.pal .flg{box-shadow:0 0 0 3px var(--hl)}.pal .cur{outline:2px solid var(--ink);outline-offset:2px}
.res{display:flex;gap:24px;align-items:center;flex-wrap:wrap}.rg,.rf{fill:none;stroke-width:11}.rg{stroke:var(--line)}.rf{stroke:var(--acc);stroke-linecap:round}.rt{font:800 26px 'Plus Jakarta Sans',sans-serif;fill:var(--ink)}
.bars{display:flex;gap:10px;align-items:flex-end;height:160px}.bars div{flex:1;background:var(--acc);border-radius:6px 6px 0 0;min-height:22px;color:var(--on);text-align:center;font-weight:700;font-size:.8rem;padding-top:2px}
.mt{height:10px;background:var(--line);border-radius:9px;margin:4px 0 12px;overflow:hidden}.mt i{display:block;height:100%;background:var(--ok)}.mt i.lo{background:var(--bad)}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
#tutor{position:fixed;right:0;top:0;bottom:0;width:min(400px,100%);background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column;padding:16px;z-index:9;box-shadow:-8px 0 30px #0003}#tutor[hidden]{display:none}
#log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;margin:12px 0}.msg{padding:9px 12px;border-radius:12px;max-width:88%;white-space:pre-wrap}.msg.u{background:var(--acc);color:var(--on);align-self:flex-end}.msg.b{background:var(--bg);border:1px solid var(--line)}
.tin{display:flex;gap:6px}.tin input{margin:0}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,90px);background:var(--ink);color:var(--card);padding:10px 18px;border-radius:99px;transition:transform .25s;z-index:20}#toast.show{transform:translate(-50%,0)}
#mdl{position:fixed;inset:0;background:#0008;display:grid;place-items:center;z-index:30}#mdl[hidden]{display:none}.mb{background:var(--card);border-radius:12px;padding:22px;max-width:420px;width:90%}
body[data-r=x] .sb,body[data-r=x] #tutor{display:none!important}body[data-r=x] .shell{grid-template-columns:1fr}body:not([data-r=t]) .t{display:none!important}
@media(max-width:800px){.shell{grid-template-columns:1fr}.sb{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:10px}.brand{padding:4px 8px}.sp{margin:0}.nb{width:auto}.exam{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.sb,.np,#tutor{display:none!important}.shell{display:block}}
</style>
</head>
<body>
<div class="shell">
<aside class="sb"><a class="brand" href="#/"><i></i>Examora</a>
<a class="nb" href="#/">Dashboard</a><a class="nb" href="#/exams">Exams</a><a class="nb t" href="#/build">Create exam</a><a class="nb t" href="#/students">Students</a><a class="nb t" href="#/inbox">Results</a><a class="nb" href="#/stats">Analytics</a><a class="nb" href="#/settings">Settings</a>
<div class="s sp" id="who" style="padding:8px 12px"></div><button class="nb" id="tb">AI tutor</button><button class="nb" id="th">Light or dark</button><button class="nb" id="lo">Log out</button></aside>
<main id="app"></main>
</div>
<section id="tutor" hidden aria-label="AI tutor"><div class="bar"><b>AI tutor</b><span><label class="chk s" style="margin:0"><input type="checkbox" id="sp"> Speak replies</label></span><button class="btn g sm" id="tx">Close</button></div><div id="log"></div><div class="tin"><input id="ti" placeholder="Ask anything about your question"><button class="btn g" id="tm" aria-label="Speak your question">Mic</button><button class="btn" id="ts">Send</button></div></section>
<div id="mdl" hidden><div class="mb" role="dialog" aria-modal="true"><p id="mt"></p><div class="row" style="justify-content:flex-end"><button class="btn g" id="mn">Cancel</button><button class="btn" id="my">OK</button></div></div></div>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},S=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const sh=n=>{const a=[...Array(n).keys()];for(let i=n;i>1;){const j=Math.random()*i--|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const dl=(n,t,m)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()};
const toast=m=>{const t=$('#toast');t.textContent=m;t.className='show';clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',3000)};
const seed=[
{id:'ict',title:'ICT fundamentals',subject:'ICT',mins:4,shuffle:1,qs:[
{q:'Which is the smallest unit of data?',o:['Byte','Bit','Kilobyte','Word'],a:1,e:'A bit is a single binary digit.'},
{q:'Which of these is an output device?',o:['Scanner','Mouse','Monitor','Microphone'],a:2,e:'Monitors display output from the computer.'},
{q:'What is HTML used for?',o:['Styling pages','Structuring web pages','Storing data','Compiling code'],a:1,e:'HTML defines page structure; CSS styles it.'},
{q:'Which memory loses its contents when power is off?',o:['ROM','SSD','RAM','HDD'],a:2,e:'RAM is volatile.'},
{q:'What does CPU stand for?',o:['Central Process Unit','Central Processing Unit','Computer Primary Unit','Core Processing Utility'],a:1,e:'Central Processing Unit.'}]},
{id:'phy',title:'Physics quickfire',subject:'Physics',mins:4,shuffle:1,qs:[
{q:'Which quantity is a vector?',o:['Speed','Velocity','Distance','Energy'],a:1,e:'Velocity has magnitude and direction.'},
{q:'What is the SI unit of force?',o:['Joule','Watt','Newton','Pascal'],a:2,e:'Force is measured in newtons.'},
{q:'The speed of light is about…',o:['3×10⁸ m/s','3×10⁶ m/s','3×10⁵ m/s','3×10¹⁰ m/s'],a:0,e:'c ≈ 3×10⁸ m/s.'},
{q:'Which law states F = ma?',o:['Newton’s first','Newton’s second','Newton’s third','Ohm’s'],a:1,e:'Newton’s second law.'},
{q:'Energy of motion is called…',o:['Potential','Thermal','Kinetic','Nuclear'],a:2,e:'Kinetic energy.'}]}];
let exams=[],hist=L('hi',[]),ses=L('se',null),cfg=L('cf',{prov:'anthropic',key:'',model:'',base:'',rate:1,lang:'en-US'}),tm,chat=[],ctx='',ctxE='',pub=null,user=L('us',null);
/* Teacher access is read from config.json, made on the #/setup page. */
let TEACHER={email:"",hash:""};
const isT=()=>user?.role=='t',TO=['build','students','inbox'];
const ask=(m,info)=>new Promise(r=>{$('#mt').textContent=m;$('#mn').hidden=!!info;$('#mdl').hidden=false;$('#my').focus();const f=v=>{$('#mdl').hidden=true;r(v)};$('#my').onclick=()=>f(true);$('#mn').onclick=()=>f(false)});
const hx=async(s,salt,it)=>{const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(s),'PBKDF2',false,['deriveBits']),b=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode(salt),iterations:it},k,256);return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')};
const b64e=s=>btoa(String.fromCharCode(...new TextEncoder().encode(s))),b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0)));
const loadEx=()=>{exams=isT()?(L('ex',null)||pub?.exams||seed):[...(pub?.exams||[]),...L('rx',[])]};
const sx=()=>isT()?S('ex',exams):S('rx',exams.filter(e=>/^r\d/.test(e.id)));
async function micOk(){
 if(location.protocol=='file:'){await ask('This page was opened as a file, and browsers block the microphone there. Open your GitHub Pages address (starting with https) instead.',1);return false}
 if(window.top!==window){await ask('This page is inside a preview frame, which blocks the microphone. Open the site in its own browser tab.',1);return false}
 try{const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop());return true}
 catch{await ask('Microphone access is blocked. Click the lock icon next to the address bar, set Microphone to Allow, then reload the page.',1);return false}}
const save=()=>ses?S('se',ses):localStorage.removeItem('se'),app=$('#app'),H=document.documentElement;
H.dataset.t=L('th',matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
$('#th').onclick=()=>S('th',H.dataset.t=H.dataset.t=='dark'?'light':'dark');
const locked=()=>ses&&ses.end&&ses.mode=='e'&&location.hash.startsWith('#/take/');

/* ---------- AI, speech ---------- */
async function ai(sys,msgs){
 if(!cfg.key)throw new Error('Add your API key in Settings first.');
 if(cfg.prov=='anthropic'){
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':cfg.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:cfg.model||'claude-haiku-5-5',max_tokens:3000,system:sys,messages:msgs})});
  const d=await r.json();if(!r.ok)throw new Error(d.error?.message||r.status);return d.content.map(x=>x.text||'').join('')}
 const r=await fetch((cfg.base||'https://api.openai.com/v1').replace(/\/$/,'')+'/chat/completions',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+cfg.key},body:JSON.stringify({model:cfg.model||'gpt-4o-mini',messages:[{role:'system',content:sys},...msgs]})});
 const d=await r.json();if(!r.ok)throw new Error(d.error?.message||r.status);return d.choices[0].message.content}
const say=t=>{if(!window.speechSynthesis)return toast('Read-aloud is not supported in this browser');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=+cfg.rate||1;u.lang=cfg.lang;speechSynthesis.speak(u)};
async function listen(cb,btn){
 const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast('Voice input needs Chrome, Edge or Safari');
 if(!await micOk())return;
 const r=new R();r.lang=cfg.lang;btn?.classList.add('rec');r.onresult=e=>cb(e.results[0][0].transcript);r.onend=()=>btn?.classList.remove('rec');r.onerror=e=>e.error=='not-allowed'?micOk():e.error!='no-speech'&&e.error!='aborted'&&toast('Microphone: '+e.error);r.start()}
function logm(r,t){const d=document.createElement('div');d.className='msg '+r;d.textContent=t;$('#log').append(d);$('#log').scrollTop=1e9;return d}
async function send(q){
 $('#tutor').hidden=false;
 if(locked())return logm('b','The tutor is locked during an exam. Use Practice mode, or ask after you submit.');
 logm('u',q);chat.push({role:'user',content:q});const d=logm('b','Thinking…');
 try{const t=cfg.key?await ai('You are a patient, concise exam tutor. Explain step by step in under 120 words. '+(ctx?'Context: '+ctx:''),chat.slice(-8)):(ctxE?'Built-in explanation: '+ctxE+' Add an API key in Settings for full AI answers.':'Add an API key in Settings to chat with the AI tutor.');
  chat.push({role:'assistant',content:t});d.textContent=t;if($('#sp').checked)say(t)}catch(e){d.textContent='AI error: '+e.message;chat.pop()}}
$('#tb').onclick=()=>$('#tutor').hidden=!$('#tutor').hidden;$('#tx').onclick=()=>$('#tutor').hidden=true;
$('#ts').onclick=()=>{const v=$('#ti').value.trim();if(v){$('#ti').value='';send(v)}};$('#ti').onkeydown=e=>{if(e.key=='Enter')$('#ts').click()};
$('#tm').onclick=e=>listen(t=>send(t),e.currentTarget);
const setCtx=(q,ch)=>{ctx=`Question: ${q.q}. Options: ${q.o.join(' | ')}. Correct: ${q.o[q.a]}.${ch!=null?' Student chose: '+q.o[ch]+'.':''}`;ctxE=q.e||''};

/* ---------- pages ---------- */
const streak=()=>{const d=new Set(hist.map(a=>new Date(a.d).toDateString()));let s=0,t=new Date();if(!d.has(t.toDateString()))t.setDate(t.getDate()-1);while(d.has(t.toDateString())){s++;t.setDate(t.getDate()-1)}return s};
const pc=a=>Math.round(a.c/a.t*100);
function home(){
 const n=hist.length,rs=ses&&ses.end&&exams.find(e=>e.id==ses.id);
 app.innerHTML=`<h1>Welcome back${user?', '+E(user.name):''}</h1><p class="mut">Create, practise and review exams with an AI tutor, read-aloud and voice answers.</p>
 ${rs?`<div class="card row sb2" style="margin-top:16px"><div><span class="tag">In progress</span><h3 style="margin:6px 0 0">${E(rs.title)}</h3></div><a class="btn" href="#/take/${rs.id}">Resume</a></div>`:''}
 <div class="tiles"><div class="card"><b>${n}</b><span class="mut">exams taken</span></div><div class="card"><b>${n?Math.round(hist.reduce((s,a)=>s+pc(a),0)/n):0}%</b><span class="mut">average score</span></div><div class="card"><b>${streak()}</b><span class="mut">day streak</span></div><div class="card"><b>${exams.length}</b><span class="mut">exams in library</span></div></div>
 <div class="grid"><div class="card t"><h2>AI exam generator</h2><p class="mut">Type a topic or paste your notes and get a full multiple-choice exam to review and save.</p><a class="btn" href="#/build">Generate an exam</a></div>
 <div class="card"><h2>Practice mode</h2><p class="mut">Instant feedback, explanations and an AI tutor after every answer. Exam mode keeps the tutor locked.</p><a class="btn g" href="#/exams">Choose an exam</a></div>
 <div class="card"><h2>Voice and read-aloud</h2><p class="mut">Hear questions read out, and answer by saying “option B”, “next” or “flag”.</p><a class="btn g" href="#/exams">Open an exam</a></div></div>`;
}

function lib(){
 app.innerHTML=`<div class="row sb2" style="margin:0 0 16px"><h1 style="margin:0">Exams</h1><div class="row t" style="margin:0"><a class="btn" href="#/build">Create exam</a><label class="btn g" style="margin:0">Import file<input id="im" type="file" accept=".json" hidden></label></div></div><div class="grid">${exams.map(e=>`<article class="card"><span class="tag">${E(e.subject||'General')}</span><h3 style="margin-top:8px">${E(e.title)}</h3><p class="mut s">${e.qs.length} questions, ${e.mins} minutes</p><div class="row"><a class="btn" href="#/take/${e.id}">${ses&&ses.id==e.id&&ses.end?'Resume':'Open'}</a><button class="btn g sm t" data-x="${e.id}">Export</button><button class="btn g sm t" data-d="${e.id}">Delete</button></div></article>`).join('')||'<p class="mut">No exams yet. Ask your teacher to publish one.</p>'}</div>`;
 document.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{const e=exams.find(x=>x.id==b.dataset.x);dl(e.title+'.json',JSON.stringify(e),'application/json')});
 document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(await ask('Delete this exam? Past results are kept.')){exams=exams.filter(x=>x.id!=b.dataset.d);sx();lib()}});
 $('#im').onchange=e=>{const f=e.target.files[0];f&&f.text().then(t=>{try{const d=[].concat(JSON.parse(t)).filter(x=>x&&x.title&&Array.isArray(x.qs)&&x.qs.length);if(!d.length)throw 0;d.forEach((x,i)=>exams.push({...x,id:'i'+Date.now()+i,mins:+x.mins||10}));sx();toast('Imported '+d.length+' exam(s)');lib()}catch{toast('That file is not a valid Examora exam')}})};
}

function build(){
 app.innerHTML=`<h1>Create exam</h1><div class="card"><h2>Generate with AI</h2><label>Topic or notes<textarea id="nt" rows="3" placeholder="Photosynthesis, or paste your class notes here"></textarea></label><div class="row"><select id="nq" style="width:auto;margin:0"><option>5</option><option selected>10</option><option>15</option></select><span class="mut s">questions</span><button class="btn g" id="dc">Dictate notes</button><button class="btn" id="ga">Generate questions</button></div><p class="mut s" id="gs">Needs an API key in Settings. Generated questions appear below so you can edit them before saving.</p></div>
 <div class="card"><label>Title<input id="t" placeholder="Biology chapter 3"></label><div class="r2"><label>Subject<input id="s" placeholder="Biology"></label><label>Minutes<input id="m" type="number" min="1" value="10"></label></div><label class="chk"><input id="sf" type="checkbox" checked> Shuffle questions and options</label><label>Questions, one per line<textarea id="q" rows="9" placeholder="Question | Option A | Option B | Option C | Option D | B | Why B is right"></textarea></label><p class="mut s">Format: question, four options, correct letter, optional explanation, separated by | characters.</p><div class="row"><button class="btn" id="sv">Save exam</button><button class="btn g" id="fx">Fill an example</button></div><p id="er" class="bad"></p></div>`;
 $('#fx').onclick=()=>$('#q').value='Which planet is closest to the Sun? | Venus | Mercury | Earth | Mars | B | Mercury orbits closest.\nWhat is 7 × 8? | 54 | 56 | 58 | 64 | B | 7 × 8 = 56.';
 $('#dc').onclick=e=>listen(t=>$('#nt').value+=(($('#nt').value?' ':'')+t),e.currentTarget);
 $('#ga').onclick=async()=>{
  const nt=$('#nt').value.trim(),g=$('#gs'),b=$('#ga');if(!nt)return g.textContent='Enter a topic or notes first.';
  b.disabled=true;g.textContent='Generating…';
  try{const t=await ai('You write exam questions. Reply with ONLY a JSON array, no prose. Each item: {"q":string,"o":[4 strings],"a":index 0-3 of the correct option,"e":one-sentence explanation}. Vary the position of the correct answer.',[{role:'user',content:`Write ${$('#nq').value} multiple-choice questions about:\n${nt}`}]);
   const arr=JSON.parse(t.slice(t.indexOf('['),t.lastIndexOf(']')+1)),c=x=>String(x).replace(/\|/g,'/').replace(/\n/g,' ');
   const ok=arr.filter(x=>x.q&&Array.isArray(x.o)&&x.o.length==4&&x.a>=0&&x.a<4);if(!ok.length)throw new Error('No valid questions came back. Try again.');

function take(id){

 if(!ses||ses.id!=id){ses={id,end:0,ans:{},fl:{},ord:ex.shuffle?sh(ex.qs.length):[...ex.qs.keys()],op:ex.qs.map(q=>ex.shuffle?sh(q.o.length):[...q.o.keys()]),i:0,sw:0,st:0,mode:'e'};save()}

function draw(ex){

function inbox(){
 const ib=L('ib',[]).sort((x,y)=>y.d-x.d);
 app.innerHTML=`<div class="row sb2" style="margin:0 0 16px"><h1 style="margin:0">Student results</h1><button class="btn g" id="ec">Download CSV</button></div><div class="card"><label>Paste result codes from students, one per line<textarea id="rc_" rows="3"></textarea></label><div class="row"><button class="btn" id="im2">Add results</button><button class="btn g" id="cl">Clear all</button></div></div>
 <div class="card" style="overflow-x:auto"><table><tr><th>Student</th><th>Exam</th><th>Score</th><th>Time</th><th>Tab switches</th><th>Mode</th><th>Date</th></tr>${ib.map(o=>`<tr><td>${E(o.n||'')}</td><td>${E(o.t)}</td><td>${Math.round(o.c/o.x*100)}% (${o.c}/${o.x})</td><td>${Math.floor(o.s/60)}m ${o.s%60}s</td><td>${o.w}</td><td>${o.m=='p'?'Practice':'Exam'}</td><td>${new Date(o.d).toLocaleDateString()}</td></tr>`).join('')||'<tr><td colspan="7" class="mut">No results yet. Students send you a result code after each exam.</td></tr>'}</table></div>`;
 $('#im2').onclick=()=>{let n=0;$('#rc_').value.split(/\s+/).filter(Boolean).forEach(c=>{try{const o=JSON.parse(b64d(c));if(!o.t||ib.some(x=>x.k==c))return;ib.push({...o,k:c});n++}catch{}});S('ib',ib);toast(n+' result(s) added');inbox()};
 $('#cl').onclick=async()=>{if(await ask('Clear all imported student results?')){S('ib',[]);inbox()}};
 $('#ec').onclick=()=>dl('student-results.csv','Student,Exam,Correct,Total,Seconds,TabSwitches,Mode,Date\n'+ib.map(o=>['"'+(o.n||'').replace(/"/g,'""')+'"','"'+o.t.replace(/"/g,'""')+'"',o.c,o.x,o.s,o.w,o.m=='p'?'Practice':'Exam',new Date(o.d).toISOString()].join(',')).join('\n'),'text/csv');
}
function go(){
 clearInterval(tm);const [p,id]=location.hash.slice(2).split('/');
 document.body.dataset.r=user?user.role:'x';$('#who').textContent=user?user.name+(isT()?' (teacher)':' (student)'):'';
 if(p=='setup'){document.body.dataset.r='x';return setup()}
 if(!user)return login();
 if(TO.includes(p)&&!isT())return location.hash='#/';
 ({exams:lib,build,take,result,stats,settings,students,inbox}[p]||home)(id);
 document.querySelectorAll('.sb a.nb').forEach(a=>a.classList.toggle('on',a.getAttribute('href')=='#/'+(p||'')));
 scrollTo(0,0);
}
$('#lo').onclick=()=>{user=null;localStorage.removeItem('us');speechSynthesis?.cancel();$('#tutor').hidden=true;location.hash='#/';go()};
(async()=>{try{const r=await fetch('data.json?'+Date.now());if(r.ok)pub=await r.json()}catch{}
 try{const r=await fetch('config.json?'+Date.now());if(r.ok){const c=await r.json();if(c.hash&&c.email)TEACHER=c}}catch{}
 loadEx();addEventListener('hashchange',go);go()})();
</script>
</body>
</html>
